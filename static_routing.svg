<!-- Datei: mesh_hourglass_diagram.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" >
  <style>
    .box { fill:#f6f9ff; stroke:#2b6cb0; stroke-width:2; rx:6; }
    .small { font: 12px sans-serif; fill:#08306b; }
    .title { font: 14px sans-serif; font-weight:700; fill:#021a4a; }
    .arrow { stroke:#666; stroke-width:2; fill:none; marker-end: url(#arrowhead); }
    .note { font: 12px monospace; fill:#08306b; }
    .mask { fill:#ffe7a3; stroke:#b36b00; stroke-width:1; rx:4; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Stage1 (Coordinates) -->
  <text x="20" y="28" class="title">Stage 1 — Coordinate Level (full)</text>
  <!-- tokens C0..C7 -->
  <g transform="translate(20,40)">
    <g id="coords">
      <rect class="box" x="0"  y="0"  width="62" height="34"/>
      <text x="10" y="22" class="small">C0</text>

      <rect class="box" x="78"  y="0"  width="62" height="34"/>
      <text x="88" y="22" class="small">C1</text>

      <rect class="box" x="156" y="0"  width="62" height="34"/>
      <text x="166" y="22" class="small">C2</text>

      <rect class="box" x="234" y="0"  width="62" height="34"/>
      <text x="244" y="22" class="small">C3</text>

      <rect class="box" x="312" y="0"  width="62" height="34"/>
      <text x="322" y="22" class="small">C4</text>

      <rect class="box" x="390" y="0"  width="62" height="34"/>
      <text x="400" y="22" class="small">C5</text>

      <rect class="box" x="468" y="0"  width="62" height="34"/>
      <text x="478" y="22" class="small">C6</text>

      <rect class="box" x="546" y="0"  width="62" height="34"/>
      <text x="556" y="22" class="small">C7</text>
    </g>
  </g>

  <!-- Arrow to Shortening1 -->
  <path class="arrow" d="M620 58 L680 58" />

  <!-- Shortening1 (factor 2) -->
  <text x="700" y="28" class="title">Shortening1 (factor=2) → Vertex Tokens</text>
  <g transform="translate(700,40)">
    <!-- V0..V3 -->
    <rect class="box" x="0" y="0" width="84" height="36"/>
    <text x="18" y="24" class="small">V0 = (C0,C1)</text>

    <rect class="box" x="106" y="0" width="84" height="36"/>
    <text x="124" y="24" class="small">V1 = (C2,C3)</text>

    <rect class="box" x="212" y="0" width="84" height="36"/>
    <text x="230" y="24" class="small">V2 = (C4,C5)</text>

    <rect class="box" x="318" y="0" width="84" height="36"/>
    <text x="336" y="24" class="small">V3 = (C6,C7)</text>
  </g>

  <!-- Arrow to Stage2 -->
  <path class="arrow" d="M900 76 L980 120" />

  <!-- Routing mask note -->
  <rect x="980" y="96" width="180" height="46" class="mask"/>
  <text x="988" y="118" class="small">Routing mask: keep V0, skip V1, keep V2, skip V3</text>

  <!-- Stage2 (vertex-level) -->
  <text x="980" y="170" class="title">Stage 2 — Vertex Level (static routing)</text>
  <g transform="translate(980,180)">
    <!-- V0 processed -->
    <rect class="box" x="0" y="0" width="92" height="36"/>
    <text x="12" y="22" class="small">V0 → V0*</text>

    <!-- V1 bypass -->
    <rect x="110" y="0" width="92" height="36" style="fill:#fff7f0; stroke:#a64d00; stroke-width:2; rx:6"/>
    <text x="122" y="22" class="small">V1 (bypass)</text>

    <!-- V2 processed -->
    <rect class="box" x="220" y="0" width="92" height="36"/>
    <text x="232" y="22" class="small">V2 → V2*</text>

    <!-- V3 bypass -->
    <rect x="330" y="0" width="92" height="36" style="fill:#fff7f0; stroke:#a64d00; stroke-width:2; rx:6"/>
    <text x="342" y="22" class="small">V3 (bypass)</text>
  </g>

  <!-- Arrow to Shortening2 -->
  <path class="arrow" d="M1060 216 L1160 260" />

  <!-- Shortening2 (factor 4) -->
  <text x="20" y="280" class="title">Shortening2 (factor=4) → Face Level</text>
  <g transform="translate(20,300)">
    <rect class="box" x="0" y="0" width="420" height="44"/>
    <text x="10" y="30" class="small">F0 = (V0*, V1, V2*, V3)</text>
  </g>

  <!-- Arrow to Stage3 -->
  <path class="arrow" d="M450 322 L560 322" />

  <!-- Stage3 (face-level) -->
  <text x="580" y="300" class="title">Stage 3 — Face Level</text>
  <g transform="translate(580,320)">
    <rect class="box" x="0" y="0" width="140" height="44"/>
    <text x="12" y="30" class="small">F0 → F0*</text>
  </g>

  <!-- Arrow to Upsample2 -->
  <path class="arrow" d="M720 342 L840 420" />

  <!-- Upsampling2 (4x Face->Vertex) -->
  <text x="860" y="420" class="title">Upsampling2 (factor=4)</text>
  <g transform="translate(860,440)">
    <rect class="box" x="0" y="0" width="110" height="36"/>
    <text x="10" y="24" class="small">V0_u</text>

    <rect class="box" x="126" y="0" width="110" height="36"/>
    <text x="136" y="24" class="small">V1_u</text>

    <rect class="box" x="252" y="0" width="110" height="36"/>
    <text x="262" y="24" class="small">V2_u</text>

    <rect class="box" x="378" y="0" width="110" height="36"/>
    <text x="388" y="24" class="small">V3_u</text>

    <text x="10" y="60" class="note">Residual add with Stage2 outputs (V0*,V1,V2*,V3)</text>
  </g>

  <!-- Arrow to Stage4 -->
  <path class="arrow" d="M1048 458 L1108 458" />

  <!-- Stage4 -->
  <text x="1120" y="430" class="title">Stage 4 — Reconstructed Vertex Level</text>
  <g transform="translate(1120,450)">
    <rect class="box" x="0" y="0" width="92" height="36"/>
    <text x="18" y="24" class="small">V0''</text>

    <rect class="box" x="108" y="0" width="92" height="36"/>
    <text x="126" y="24" class="small">V1''</text>

    <rect class="box" x="216" y="0" width="92" height="36"/>
    <text x="234" y="24" class="small">V2''</text>

    <rect class="box" x="324" y="0" width="92" height="36"/>
    <text x="342" y="24" class="small">V3''</text>
  </g>

  <!-- Arrow to Upsampling1 -->
  <path class="arrow" d="M860 516 L760 580" />

  <!-- Upsampling1 (factor=2) -->
  <text x="640" y="590" class="title">Upsampling1 (factor=2) → Coordinate Level</text>
  <g transform="translate(640,610)">
    <!-- Expand each V'' to two coords -->
    <rect class="box" x="0" y="0" width="84" height="32"/>
    <text x="14" y="21" class="small">C0_u</text>
    <rect class="box" x="98" y="0" width="84" height="32"/>
    <text x="112" y="21" class="small">C1_u</text>

    <rect class="box" x="206" y="0" width="84" height="32"/>
    <text x="220" y="21" class="small">C2_u</text>
    <rect class="box" x="304" y="0" width="84" height="32"/>
    <text x="318" y="21" class="small">C3_u</text>

    <rect class="box" x="412" y="0" width="84" height="32"/>
    <text x="426" y="21" class="small">C4_u</text>
    <rect class="box" x="510" y="0" width="84" height="32"/>
    <text x="524" y="21" class="small">C5_u</text>

    <rect class="box" x="618" y="0" width="84" height="32"/>
    <text x="632" y="21" class="small">C6_u</text>
    <rect class="box" x="716" y="0" width="84" height="32"/>
    <text x="730" y="21" class="small">C7_u</text>

    <text x="10" y="56" class="note">Residual add with Stage1 outputs (C0'..C7')</text>
  </g>

  <!-- Arrow to Stage5 -->
  <path class="arrow" d="M760 648 L520 648" />

  <!-- Stage5 (final) -->
  <text x="340" y="660" class="title">Stage 5 — Final Coordinate Processing</text>
  <g transform="translate(340,680)">
    <rect class="box" x="0" y="0" width="58" height="30"/><text x="10" y="20" class="small">C0_out</text>
    <rect class="box" x="76" y="0" width="58" height="30"/><text x="86" y="20" class="small">C1_out</text>
    <rect class="box" x="152" y="0" width="58" height="30"/><text x="162" y="20" class="small">C2_out</text>
    <rect class="box" x="228" y="0" width="58" height="30"/><text x="238" y="20" class="small">C3_out</text>
    <rect class="box" x="304" y="0" width="58" height="30"/><text x="314" y="20" class="small">C4_out</text>
    <rect class="box" x="380" y="0" width="58" height="30"/><text x="390" y="20" class="small">C5_out</text>
    <rect class="box" x="456" y="0" width="58" height="30"/><text x="466" y="20" class="small">C6_out</text>
    <rect class="box" x="532" y="0" width="58" height="30"/><text x="542" y="20" class="small">C7_out</text>
  </g>

</svg>

