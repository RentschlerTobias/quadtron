INPUT (Coords) Stage1 (full)
C0 C1 C2 C3 C4 C5 C6 C7   (→ C0'..C7')

Shortening1 (factor=2) -> Vertices
(C0',C1')  (C2',C3')  (C4',C5')  (C6',C7')
   V0         V1         V2         V3

Static Routing (mask: keep V0, skip V1, keep V2, skip V3)
-> Stage2 processes only V0 and V2:
   V0 -> V0*     V1 (bypass)     V2 -> V2*     V3 (bypass)
Combined: [V0*, V1, V2*, V3]

Shortening2 (factor=4) -> Face
(V0*,V1,V2*,V3) -> F0

Stage3 (Face-level): F0 -> F0*

Upsampling2 (factor=4) Face -> Vertex
F0* -> V0_u  V1_u  V2_u  V3_u
(residual add with V0*,V1,V2*,V3)

Stage4 (vertex recon) -> V0'' V1'' V2'' V3''

Upsampling1 (factor=2) Vertex -> Coordinates
V0'' -> C0_u, C1_u
V1'' -> C2_u, C3_u
V2'' -> C4_u, C5_u
V3'' -> C6_u, C7_u
(residual add with C0'..C7')

Stage5 (final coords) -> C0_out .. C7_out

