<script>
(function () {
  var gd = document.getElementById('tokviz');
  var idx = 0;
  var maxIdx = 16;
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var progressMask = document.getElementById('progressMask');
  function render() {
    Plotly.animate(gd, [String(idx)],
      {frame: {duration: 0, redraw: true}, transition: {duration: 0}, mode: 'immediate'});
    progressMask.style.width = (100 - (idx / maxIdx) * 100) + '%';
    prevBtn.disabled = (idx === 0);
    nextBtn.disabled = (idx === maxIdx);
  }
  prevBtn.addEventListener('click', function () { if (idx > 0) { idx -= 1; render(); } });
  nextBtn.addEventListener('click', function () { if (idx < maxIdx) { idx += 1; render(); } });
  prevBtn.disabled = true;
  window.addEventListener('resize', function () { Plotly.Plots.resize(gd); });
  window.addEventListener('load', function () { Plotly.Plots.resize(gd); });
})();
</script>
