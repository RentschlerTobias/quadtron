project:
  title: "AIFluids 2026 — Adjacency-Preserving Quad Tokenization"

format:
  revealjs:
    theme: [default, broadsheet.scss]
    width: 1920
    height: 1080
    margin: 0.035
    min-scale: 0.2
    max-scale: 2.0
    center: false
    slide-number: c/t
    footer: "AIFluids 2026 · IHS Stuttgart"

    title-slide-attributes:
      data-background-image: images/titel_la_mirror.png
      data-background-size: cover
      data-background-position: center

    chalkboard: true
    menu:
      side: left
      numbers: true
    # linear: all 4 arrows chain across chapter boundaries (down/right = next,
    # up/left = prev) so you never get stuck at the bottom of a column. Was
    # "grid" (strict spatial moves, no chaining) — reapply this note if this
    # deck's structure is reused (e.g. the Eigenfrequency deck).
    # nav-chain.html patches left/right back to a direct sideways chapter
    # jump, but only on the first slide of a column (see file for why).
    navigation-mode: linear
    include-after-body: nav-chain.html
    controls: true
    controls-layout: bottom-right
    progress: true
    hash: true
    transition: fade
    transition-speed: fast
    overview: true
    touch: true

    html-math-method: mathjax
    fig-align: left
    incremental: false
    link-external-newwindow: true
